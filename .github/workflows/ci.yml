name: Council CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: council-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Council CI
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0
          package-manager-cache: false

      - name: Enable repository pnpm version
        id: toolchain
        shell: bash
        run: |
          corepack enable
          pnpm_version="$(node -p "require('./package.json').packageManager.split('@').at(-1)")"
          corepack prepare "pnpm@${pnpm_version}" --activate
          echo "pnpm-version=${pnpm_version}" >> "$GITHUB_OUTPUT"
          echo "store-path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.toolchain.outputs.store-path }}
          key: ${{ runner.os }}-${{ runner.arch }}-node-24.11.0-pnpm-${{ steps.toolchain.outputs.pnpm-version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-24.11.0-pnpm-${{ steps.toolchain.outputs.pnpm-version }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pinned blocking static audit
        run: pnpm audit:static

      - name: Test read-only npm verification
        run: node --test scripts/ci/verify-npm.test.mjs

      - name: Run typecheck, tests, and build
        run: node scripts/ci/run-checks.mjs

      - name: Build and smoke-test the npm archive
        run: pnpm test:package
